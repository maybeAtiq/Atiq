    <!-- Dark by default; apply a saved light choice before first paint to avoid a flash -->
    <script>
      (function () {
        var dark = true;
        try {
          dark = localStorage.getItem("theme") !== "light";
        } catch (e) {}
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
